<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1f1c" />
<meta name="description" content="linao的小窝 · 留言板 — 不用登录，写两句就走。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e2621'/%3E%3Ccircle cx='32' cy='36' r='15' fill='%237fd6b4'/%3E%3Cpath d='M19 24l4 11-9-5z' fill='%23a8f0d2'/%3E%3Cpath d='M45 24l-4 11 9-5z' fill='%23a8f0d2'/%3E%3Ccircle cx='27' cy='36' r='2.2' fill='%230b1f1c'/%3E%3Ccircle cx='37' cy='36' r='2.2' fill='%230b1f1c'/%3E%3Cpath d='M28 42q4 3 8 0' stroke='%230b1f1c' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<title>留言板 · linao的小窝</title>
<style>
:root{
  --paper:#f7faf8;--card:#ffffff;--line:#dbe7e1;
  --text:#16302a;--text-soft:#4c6560;--text-faint:#8aa29b;
  --accent:#7fd6b4;--accent-soft:#a8f0d2;--accent-deep:#2f8f6f;--accent-glow:rgba(127,214,180,.42);
  --sans:"PingFang SC","Microsoft YaHei UI","Hiragino Sans GB","Noto Sans SC","Segoe UI",sans-serif;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  --mono:"Cascadia Mono","Consolas",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-accent="pink"]{--accent:#ffb3d9;--accent-soft:#ffd3e8;--accent-deep:#c95f92;--accent-glow:rgba(255,179,217,.42)}
html[data-accent="blue"]{--accent:#9fd0ff;--accent-soft:#c8e6ff;--accent-deep:#4a86bd;--accent-glow:rgba(159,208,255,.42)}
html[data-theme="dark"]{--paper:#0d1f1b;--card:#122a24;--line:#1d3a32;--text:#e6f3ee;--text-soft:#a9c6bd;--text-faint:#6e8b83}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;transition:background .4s,color .4s;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--accent);color:#08150f}

.topbar{position:sticky;top:0;z-index:50;background:rgba(247,250,248,.82);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(22,48,42,.07);transition:background .4s,border-color .4s}
html[data-theme="dark"] .topbar{background:rgba(10,26,23,.84);border-bottom-color:rgba(231,240,236,.08)}
.topbar-inner{max-width:1000px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px}
.brand-avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(160deg,#12302a,#1b463b);box-shadow:0 4px 12px -6px rgba(18,48,42,.8)}
.brand-avatar svg{width:22px;height:22px}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand-name em{font-style:normal;color:var(--accent-deep)}
html[data-theme="dark"] .brand-name em{color:var(--accent)}
.crumb{color:var(--text-faint);font-size:13px;letter-spacing:.1em}
.spacer{flex:1}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-soft);transition:.2s var(--ease)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
.back-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-size:12.5px;
  border:1px solid var(--line);color:var(--text-soft);transition:.22s var(--ease)}
.back-pill:hover{color:var(--text);border-color:var(--accent-deep);transform:translateY(-1px)}
.back-pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.hero{position:relative;overflow:hidden;padding:54px 22px 42px;
  background:radial-gradient(120% 92% at 50% 0%,#2b6353 0%,#1b463b 34%,#12302a 62%,#0a1f1b 100%);
  color:#eef7f3;text-align:center}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 60% at 20% 20%,rgba(127,214,180,.16),transparent 70%),
             radial-gradient(50% 50% at 82% 12%,rgba(159,208,255,.12),transparent 72%)}
.hero-inner{position:relative;max-width:720px;margin:0 auto}
.hero .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.38em;color:rgba(210,240,230,.6);text-transform:uppercase}
.hero h1{margin:14px 0 12px;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.04em;text-shadow:0 16px 44px rgba(0,0,0,.45)}
.hero p{margin:0;font-size:13.5px;line-height:2;color:rgba(226,244,237,.72)}
.hero .tip{display:inline-flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.hero .tip span{font-size:11.5px;padding:4px 11px;border-radius:999px;
  border:1px solid rgba(226,244,237,.18);background:rgba(233,247,241,.07);color:rgba(226,244,237,.8)}
.wave{line-height:0;margin-top:-1px}
.wave svg{width:100%;height:60px;display:block}

main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:30px 22px 56px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 26px 60px -46px rgba(8,23,20,.8);padding:22px;margin-bottom:22px}
.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel-head h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.03em}
.panel-head .en{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--text-faint);text-transform:uppercase}
.panel-head .line{flex:1;height:1px;min-width:30px;background:linear-gradient(90deg,var(--line),transparent)}
.panel-head .count{font-family:var(--mono);font-size:11px;color:var(--text-faint)}

/* 表单 */
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{
  flex:1 1 220px;display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);transition:.2s;
}
.field:focus-within{border-color:var(--accent-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field input{flex:1;border:0;background:transparent;outline:none;font:inherit;font-size:14px;color:var(--text)}
.field svg{width:15px;height:15px;stroke:var(--text-faint);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;
  border:1px solid var(--line);background:var(--paper);transition:.18s var(--ease);opacity:.65;
}
.mood:hover{transform:translateY(-2px);opacity:1}
.mood[aria-pressed="true"]{
  opacity:1;border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  background:color-mix(in srgb,var(--accent) 18%,transparent);
  box-shadow:0 6px 16px -12px var(--accent-glow);
}

.textarea-wrap{position:relative}
textarea{
  width:100%;min-height:120px;resize:vertical;padding:14px 16px 34px;border-radius:16px;
  border:1px solid var(--line);background:var(--paper);color:var(--text);
  font:inherit;font-size:14px;line-height:1.9;outline:none;transition:.2s;
}
textarea:focus{border-color:var(--accent-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.counter{position:absolute;right:14px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.counter.over{color:#d9534f}

.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--text-faint);line-height:1.7}
.submit{
  display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;
  font-size:13.5px;font-weight:700;color:#08150f;
  background:linear-gradient(150deg,var(--accent-soft),var(--accent));
  box-shadow:0 14px 28px -18px var(--accent-glow);transition:.22s var(--ease);
}
.submit:hover{transform:translateY(-2px)}
.submit:disabled{opacity:.55;cursor:progress;transform:none}
.submit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* 列表 */
.msg{
  display:flex;gap:12px;padding:16px 4px;border-bottom:1px dashed var(--line);
}
.msg:last-child{border-bottom:0}
.msg-avatar{
  flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
}
.msg-body{min-width:0;flex:1}
.msg-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.msg-name{font-weight:700;font-size:13.5px}
.msg-time{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em}
.msg-text{margin:6px 0 0;font-size:13.5px;line-height:1.95;color:var(--text-soft);white-space:pre-wrap;word-break:break-word}

.state{padding:34px 10px;text-align:center;color:var(--text-faint);font-size:13px;line-height:2}
.state b{color:var(--text-soft)}
.state a{color:var(--accent-deep);border-bottom:1px dashed color-mix(in srgb,var(--accent) 50%,transparent)}
html[data-theme="dark"] .state a{color:var(--accent)}
.sk{display:grid;gap:12px;padding:10px 4px}
.sk i{display:block;height:13px;border-radius:7px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent),color-mix(in srgb,var(--accent) 3%,transparent),color-mix(in srgb,var(--accent) 12%,transparent));
  background-size:200% 100%;animation:sh 1.6s linear infinite}
.sk i:nth-child(2){width:64%}
.sk i:nth-child(3){width:82%}
@keyframes sh{to{background-position:-200% 0}}

.footer{padding:24px 22px 38px;text-align:center;border-top:1px solid var(--line);color:var(--text-faint);font-size:11.5px;line-height:2}
.footer .sig{font-family:var(--serif);font-size:12.5px;letter-spacing:.18em;color:var(--text-soft)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:120;
  padding:10px 18px;border-radius:999px;background:rgba(12,32,27,.94);color:#e6f3ee;
  border:1px solid rgba(168,240,210,.28);font-size:12.5px;transition:transform .3s var(--ease),opacity .3s}
.toast[data-show="true"]{transform:translate(-50%,0);opacity:1}

@media (max-width:620px){
  .topbar-inner{padding:8px 14px;gap:10px}
  .brand-name{font-size:15px}
  .crumb{display:none}
  .hero{padding:42px 18px 36px}
  main{padding:22px 14px 44px}
  .panel{padding:16px 14px;border-radius:18px}
  .form-foot{flex-direction:column;align-items:stretch}
  .submit{justify-content:center}
  .wave svg{height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../" aria-label="回到首页">
      <span class="brand-avatar" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="23" r="11" fill="#a8f0d2"/><path d="M11 13l3 9-8-5z" fill="#d8f7ea"/><path d="M29 13l-3 9 8-5z" fill="#d8f7ea"/><circle cx="16" cy="23" r="1.7" fill="#0b211d"/><circle cx="24" cy="23" r="1.7" fill="#0b211d"/><path d="M17.5 27.5q2.5 2 5 0" stroke="#0b211d" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">linao<em>的小窝</em></span>
    </a>
    <span class="crumb">/ 留言板</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色模式">
      <svg viewBox="0 0 24 24" aria-hidden="true" id="themeIcon"></svg>
    </button>
    <a class="back-pill" href="../">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
      回到首页
    </a>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <p class="kicker">Guestbook · 留言板</p>
    <h1>来都来了，写两句吧</h1>
    <p>不用注册、不用登录，写上名字就能留。<br />骂我也行，夸我也行，路过打个招呼也行。</p>
    <div class="tip">
      <span>匿名留言</span>
      <span>不用等审核</span>
      <span>五分钟能说五句</span>
    </div>
  </div>
</section>
<div class="wave" aria-hidden="true">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none">
    <path fill="var(--paper)" d="M0,34 C180,66 320,8 500,22 C680,36 780,68 960,56 C1140,44 1280,10 1440,26 L1440,72 L0,72 Z"/>
  </svg>
</div>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>写点什么</h2>
      <span class="en">Leave a note</span>
      <span class="line"></span>
      <span class="count" id="formNote">最多 500 字</span>
    </div>

    <form id="form" autocomplete="off">
      <div class="form-row">
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>
          <input id="name" name="name" type="text" maxlength="24" placeholder="你的名字（不写就是「路过的人」）" aria-label="你的名字" />
        </label>
        <div class="moods" id="moods" role="group" aria-label="选个心情"></div>
      </div>

      <div class="textarea-wrap">
        <textarea id="text" name="text" maxlength="500" placeholder="想说的话…&#10;（可以换行，最多 500 字，最多放一个链接）" aria-label="留言内容"></textarea>
        <span class="counter" id="counter">0 / 500</span>
      </div>

      <input class="hp" id="hp" name="hp" type="text" tabindex="-1" aria-hidden="true" />

      <div class="form-foot">
        <span class="hint">留言会出现在下面的列表里 · 请别发广告和攻击别人的话</span>
        <button class="submit" id="submit" type="submit">
          发出去
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6-7-2z"/></svg>
        </button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>大家的留言</h2>
      <span class="en">Messages</span>
      <span class="line"></span>
      <span class="count" id="count">加载中…</span>
    </div>
    <div id="list" aria-live="polite">
      <div class="sk"><i></i><i></i><i></i></div>
    </div>
  </section>
</main>

<footer class="footer">
  <p class="sig">以云为纸，以海为墨</p>
  <p>© 2026 linao的小窝 · 留言板</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     后端地址（Cloudflare Worker）
     ========================================================= */
  var API_BASE = "https://linao-guestbook.ningfu334.workers.dev";
  var qs = new URLSearchParams(location.search);
  if (qs.get("api")) API_BASE = qs.get("api");

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var html = document.documentElement;
  var MOODS = ["🌿", "☁️", "🌊", "🍃", "✨", "🐾", "🌙", "🍵"];
  var currentMood = "🌿";

  /* ---------------- 主题 ---------------- */
  var THEME_KEY = "linao-nest-theme";
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  var icon = $("#themeIcon");
  function paintIcon() {
    icon.innerHTML = html.dataset.theme === "dark"
      ? '<path d="M20 14.5A8.5 8.5 0 019.5 4 9 9 0 1020 14.5z"/>'
      : '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>';
  }
  function setTheme(mode, persist) {
    html.dataset.theme = mode;
    paintIcon();
    if (persist) { try { localStorage.setItem(THEME_KEY, mode); } catch (e) {} }
  }
  setTheme(savedTheme === "dark" ? "dark" : "light", false);
  $("#themeBtn").addEventListener("click", function () {
    setTheme(html.dataset.theme === "dark" ? "light" : "dark", true);
  });

  /* ---------------- 提示 ---------------- */
  var toastEl = $("#toast"), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.dataset.show = "true";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.dataset.show = "false"; }, 2400);
  }

  /* ---------------- 心情选择 ---------------- */
  var moodsEl = $("#moods");
  moodsEl.innerHTML = MOODS.map(function (m, i) {
    return '<button class="mood" type="button" data-mood="' + m + '" aria-pressed="' + (i === 0) + '" title="选这个心情">' + m + "</button>";
  }).join("");
  moodsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".mood");
    if (!btn) return;
    currentMood = btn.dataset.mood;
    Array.prototype.forEach.call(moodsEl.children, function (b) {
      b.setAttribute("aria-pressed", String(b === btn));
    });
  });

  /* ---------------- 字数 ---------------- */
  var textEl = $("#text"), counter = $("#counter");
  textEl.addEventListener("input", function () {
    var n = textEl.value.length;
    counter.textContent = n + " / 500";
    counter.classList.toggle("over", n > 500);
  });

  /* ---------------- 昵称记忆 ---------------- */
  var nameEl = $("#name");
  try {
    var savedName = localStorage.getItem("linao-guestbook-name");
    if (savedName) nameEl.value = savedName;
  } catch (e) {}

  /* ---------------- 渲染 ---------------- */
  var listEl = $("#list"), countEl = $("#count");
  var serverList = [];   // 服务端最近一次拿到的列表
  var pending = [];      // 刚发出去、服务端列表还没来得及更新的（KV 有 ~30s 延迟）

  function timeText(ts) {
    var diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    if (diff < 86400 * 30) return Math.floor(diff / 86400) + " 天前";
    var d = new Date(ts);
    return d.getFullYear() + "." + ("0" + (d.getMonth() + 1)).slice(-2) + "." + ("0" + d.getDate()).slice(-2);
  }

  function renderList(messages) {
    if (!messages.length) {
      listEl.innerHTML = '<div class="state">还没有人留言，<b>来当第一个吧</b> 🌿</div>';
      countEl.textContent = "0 条留言";
      return;
    }
    listEl.innerHTML = messages.map(function (m) {
      var isPending = m.__pending;
      return (
        '<article class="msg">' +
          '<span class="msg-avatar" aria-hidden="true">' + (MOODS.indexOf(m.mood) >= 0 ? m.mood : "🌿") + "</span>" +
          '<div class="msg-body">' +
            '<div class="msg-top">' +
              '<span class="msg-name">' + esc(m.name) + "</span>" +
              '<span class="msg-time">' + (isPending ? "刚刚 · 发送成功" : timeText(m.at)) + "</span>" +
            "</div>" +
            '<p class="msg-text">' + esc(m.text) + "</p>" +
          "</div>" +
        "</article>"
      );
    }).join("");
    countEl.textContent = messages.length + " 条留言";
  }

  // 合并：服务端列表在前，还没同步过来的「刚发的」并进去，同步到就自动去掉
  function paint(list) {
    serverList = list || serverList;
    var seen = {};
    serverList.forEach(function (m) { seen[m.id] = true; });
    pending = pending.filter(function (m) { return !seen[m.id]; });
    renderList(pending.map(function (m) { return Object.assign({ __pending: true }, m); }).concat(serverList));
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function loadMessages() {
    return fetch(API_BASE + "/api/messages?limit=60", { headers: { Accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.message || "读取失败");
        paint(data.messages || []);
      })
      .catch(function (err) {
        if (serverList.length || pending.length) return; // 已经有内容就别把列表清空
        listEl.innerHTML =
          '<div class="state">留言暂时读不出来…<br />' +
          "可能是后端还在路上，稍后再刷新看看 · <b>" + esc(String(err.message || err)) + "</b></div>";
        countEl.textContent = "离线";
      });
  }

  /* ---------------- 提交 ---------------- */
  var form = $("#form"), submitBtn = $("#submit");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = textEl.value.trim();
    var name = nameEl.value.trim();

    if (!text) { toast("还没写字呢～"); textEl.focus(); return; }
    if (text.length > 500) { toast("太长了，砍到 500 字以内吧"); return; }

    submitBtn.disabled = true;
    var oldLabel = submitBtn.innerHTML;
    submitBtn.textContent = "发送中…";

    fetch(API_BASE + "/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, text: text, mood: currentMood, hp: $("#hp").value })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (!res.data.ok) throw new Error(res.data.message || "发送失败");
        // 先本地插进去：KV 的列表有几十秒延迟，不能让人以为自己没发出去
        if (res.data.message) {
          pending.unshift(res.data.message);
          paint(serverList);
        }
        textEl.value = "";
        counter.textContent = "0 / 500";
        if (name) { try { localStorage.setItem("linao-guestbook-name", name); } catch (err) {} }
        toast("留言成功，谢谢你来 ♡");
        setTimeout(loadMessages, 1500);
        setTimeout(loadMessages, 20000);
        setTimeout(loadMessages, 45000);
      })
      .catch(function (err) {
        toast(String(err.message || "发送失败，稍后再试"));
      })
      .then(function () {
        submitBtn.disabled = false;
        submitBtn.innerHTML = oldLabel;
      });
  });

  loadMessages();
  setInterval(loadMessages, 60000);
})();
</script>
</body>
</html>
